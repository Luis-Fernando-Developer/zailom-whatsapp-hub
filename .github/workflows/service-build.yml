name: Service TypeScript Build

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/service-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
